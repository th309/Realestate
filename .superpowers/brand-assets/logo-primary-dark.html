<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 600px;
        height: 200px;
        overflow: hidden;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .text {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .wordmark {
        font-family: "Roboto", sans-serif;
        font-weight: 700;
        font-size: 36px;
        color: #e8eaf6;
        letter-spacing: -0.5px;
      }
      .wordmark .iq {
        color: #c5cae9;
      }
      .tagline {
        font-family: "Roboto", sans-serif;
        font-weight: 400;
        font-size: 14px;
        color: #7986cb;
        letter-spacing: 0.25px;
      }
    </style>
  </head>
  <body>
    <div class="lockup">
      <svg width="72" height="72" viewBox="0 0 64 64" fill="none">
        <rect width="64" height="64" rx="14" fill="#3949AB" />
        <path
          d="M20 16V48H26V38H34C40.627 38 46 32.627 46 26C46 19.373 40.627 16 34 16H20Z"
          fill="white"
        />
        <circle cx="34" cy="26" r="6" fill="#3949AB" />
        <circle cx="44" cy="44" r="4" fill="#00C853" />
        <circle cx="36" cy="48" r="2.5" fill="#00C853" opacity="0.6" />
      </svg>
      <div class="text">
        <div class="wordmark">Property<span class="iq">IQ</span></div>
        <div class="tagline">The IQ Behind Every Market</div>
      </div>
    </div>
  </body>
</html>
