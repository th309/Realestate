<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PropertyIQ Brand Assets Gallery</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Roboto", sans-serif;
        background: #0f1218;
        color: #e8eaf6;
        padding: 48px;
      }
      h1 {
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #fff;
      }
      .subtitle {
        color: #7986cb;
        font-size: 16px;
        margin-bottom: 48px;
      }
      .asset {
        margin-bottom: 48px;
      }
      .asset-label {
        font-weight: 500;
        font-size: 14px;
        color: #7986cb;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 12px;
      }
      .asset-dims {
        font-size: 13px;
        color: #5c6bc0;
        margin-bottom: 12px;
      }
      .asset img {
        max-width: 100%;
        border-radius: 8px;
        border: 1px solid rgba(121, 134, 203, 0.2);
      }
    </style>
  </head>
  <body>
    <h1>PropertyIQ Brand Assets</h1>
    <p class="subtitle">
      5 production-ready assets — Roboto / Roboto Mono / Indigo palette
    </p>

    <div class="asset">
      <div class="asset-label">1. OG Image (Social Share)</div>
      <div class="asset-dims">1200 × 630 px</div>
      <img src="piq-og-image-1200x630.png" alt="OG Image" />
    </div>

    <div class="asset">
      <div class="asset-label">2. Social Post Template</div>
      <div class="asset-dims">1080 × 1080 px</div>
      <img
        src="piq-social-post-1080x1080.png"
        alt="Social Post"
        style="max-width: 540px"
      />
    </div>

    <div class="asset">
      <div class="asset-label">3. PIQ Avatar</div>
      <div class="asset-dims">400 × 400 px</div>
      <img
        src="piq-avatar-400x400.png"
        alt="PIQ Avatar"
        style="max-width: 200px"
      />
    </div>

    <div class="asset">
      <div class="asset-label">4. X (Twitter) Banner</div>
      <div class="asset-dims">1500 × 500 px</div>
      <img src="piq-x-banner-1500x500.png" alt="X Banner" />
    </div>

    <div class="asset">
      <div class="asset-label">5. LinkedIn Banner</div>
      <div class="asset-dims">1584 × 396 px</div>
      <img src="piq-linkedin-banner-1584x396.png" alt="LinkedIn Banner" />
    </div>
  </body>
</html>
