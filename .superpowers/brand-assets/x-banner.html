<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1500px;
        height: 500px;
        overflow: hidden;
        font-family: "Roboto", sans-serif;
        background: linear-gradient(
          135deg,
          #1a237e 0%,
          #283593 40%,
          #3949ab 100%
        );
        display: flex;
        align-items: center;
        position: relative;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.015) 1px,
            transparent 1px
          );
        background-size: 50px 50px;
      }
      /* Gradient accent at bottom */
      .bottom-accent {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #3949ab, #00c853, #3949ab);
      }
      .content {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 0 120px;
      }
      .left {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .logo-row {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .wordmark {
        font-weight: 700;
        font-size: 48px;
        color: #ffffff;
        letter-spacing: -1px;
      }
      .wordmark .iq {
        color: #c5cae9;
      }
      .tagline {
        font-weight: 400;
        font-size: 22px;
        color: #c5cae9;
        letter-spacing: 0.5px;
      }
      .url {
        font-family: "Roboto Mono", monospace;
        font-weight: 400;
        font-size: 15px;
        color: #5c6bc0;
        letter-spacing: 1px;
      }
      /* Right side - data visualization */
      .data-viz {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        opacity: 0.25;
      }
      .bar {
        width: 16px;
        border-radius: 4px 4px 0 0;
        background: #c5cae9;
      }
      .bar.accent {
        background: #00c853;
      }
      /* Floating data dots */
      .float-dots {
        position: absolute;
        right: 300px;
        top: 60px;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="bottom-accent"></div>

    <!-- Floating dots -->
    <svg
      class="float-dots"
      width="300"
      height="200"
      viewBox="0 0 300 200"
      fill="none"
    >
      <circle cx="30" cy="160" r="4" fill="#7986CB" opacity="0.15" />
      <circle cx="80" cy="120" r="5" fill="#C5CAE9" opacity="0.12" />
      <circle cx="140" cy="80" r="6" fill="#7986CB" opacity="0.1" />
      <circle cx="200" cy="50" r="7" fill="#00C853" opacity="0.15" />
      <circle cx="260" cy="30" r="5" fill="#00C853" opacity="0.1" />
      <polyline
        points="30,160 80,120 140,80 200,50 260,30"
        stroke="#00C853"
        stroke-width="1"
        fill="none"
        opacity="0.08"
        stroke-linecap="round"
      />
    </svg>

    <div class="content">
      <div class="left">
        <div class="logo-row">
          <svg width="56" height="56" viewBox="0 0 64 64" fill="none">
            <rect
              width="64"
              height="64"
              rx="14"
              fill="rgba(255,255,255,0.12)"
            />
            <path
              d="M20 16V48H26V38H34C40.627 38 46 32.627 46 26C46 19.373 40.627 16 34 16H20Z"
              fill="white"
            />
            <circle cx="34" cy="26" r="6" fill="#3949AB" />
            <circle cx="44" cy="44" r="4" fill="#00C853" />
            <circle cx="36" cy="48" r="2.5" fill="#00C853" opacity="0.6" />
          </svg>
          <div class="wordmark">Property<span class="iq">IQ</span></div>
        </div>
        <div class="tagline">The IQ Behind Every Market</div>
        <div class="url">propertyiq.app</div>
      </div>
      <div class="data-viz">
        <div class="bar" style="height: 60px"></div>
        <div class="bar" style="height: 90px"></div>
        <div class="bar" style="height: 75px"></div>
        <div class="bar" style="height: 120px"></div>
        <div class="bar" style="height: 100px"></div>
        <div class="bar accent" style="height: 150px"></div>
        <div class="bar accent" style="height: 180px"></div>
        <div class="bar" style="height: 140px"></div>
        <div class="bar" style="height: 110px"></div>
        <div class="bar accent" style="height: 200px"></div>
      </div>
    </div>
  </body>
</html>
