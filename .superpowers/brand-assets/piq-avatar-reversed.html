<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 400px;
        height: 400px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
      }
      .inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div class="inner">
      <svg width="360" height="360" viewBox="0 0 96 96" fill="none">
        <text
          x="48"
          y="58"
          text-anchor="middle"
          font-family="Roboto, sans-serif"
          font-weight="800"
          font-size="38"
          fill="#1A237E"
          letter-spacing="-1"
        >
          PIQ
        </text>
        <!-- Ascending dots -->
        <circle cx="30" cy="72" r="3" fill="#5C6BC0" />
        <circle cx="42" cy="69" r="3.5" fill="#3949AB" />
        <circle cx="54" cy="65" r="4" fill="#00C853" />
        <circle cx="66" cy="60" r="4.5" fill="#00C853" opacity="0.7" />
      </svg>
    </div>
  </body>
</html>
