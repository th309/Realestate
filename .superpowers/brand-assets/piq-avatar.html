<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 400px;
        height: 400px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
      }
      .avatar {
        width: 400px;
        height: 400px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1a237e 0%, #3949ab 100%);
        border-radius: 40px;
        position: relative;
        overflow: hidden;
      }
      /* Subtle grid */
      .avatar::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 20px 20px;
      }
      .inner {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div class="avatar">
      <div class="inner">
        <svg width="280" height="280" viewBox="0 0 96 96" fill="none">
          <text
            x="48"
            y="58"
            text-anchor="middle"
            font-family="Roboto, sans-serif"
            font-weight="800"
            font-size="38"
            fill="white"
            letter-spacing="-1"
          >
            PIQ
          </text>
          <!-- Ascending dots -->
          <circle cx="30" cy="72" r="3" fill="#7986CB" />
          <circle cx="42" cy="69" r="3.5" fill="#C5CAE9" />
          <circle cx="54" cy="65" r="4" fill="#00C853" />
          <circle cx="66" cy="60" r="4.5" fill="#00C853" opacity="0.7" />
        </svg>
      </div>
    </div>
  </body>
</html>
