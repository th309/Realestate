name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main

# Cancel in-progress runs for the same PR to save minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    name: Lint backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint -w backend

  lint-frontend:
    name: Lint frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint -w web

  typecheck-frontend:
    name: Typecheck frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # next.config.mjs sets typescript.ignoreBuildErrors: true (load-bearing,
      # do not remove) so build-frontend does NOT catch TS errors. This job is
      # the only CI gate on frontend TypeScript correctness.
      #
      # Caveat: this runs on an ubuntu runner, which is case-sensitive. It
      # cannot reproduce Windows/macOS path case-collision errors (TS1261) —
      # devs on case-insensitive filesystems remain the net for those.
      - name: Typecheck frontend (app)
        working-directory: packages/frontend
        run: npx tsc --noEmit

      - name: Typecheck frontend (service worker)
        working-directory: packages/frontend
        run: npx tsc -p tsconfig.worker.json --noEmit

  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm run test -w backend
        env:
          # Unit tests run against mocked services — no real credentials needed.
          # Integration tests that need DB should be gated separately.
          NODE_ENV: test

  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build -w backend

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -w web
        env:
          # Provide placeholder values so Next.js doesn't fail on missing env vars at build time.
          # Real secrets are never exposed in CI — they live in Railway/Vercel.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder_anon_key' }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.propertyiq.app' }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || '' }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN || 'placeholder_mapbox_token' }}

  check-required-env-vars:
    name: Check required env vars vs Railway
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit required env vars
        run: node scripts/check-required-env-vars.js
        env:
          # All three required to enable the Railway-side diff. If any is
          # missing the script still runs and prints the static list, but
          # exits 0 without comparing against Railway. Add RAILWAY_TOKEN
          # as a repo secret (Personal Access Token from
          # https://railway.app/account/tokens) to enable the gate.
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_BACKEND_SERVICE_ID: ${{ secrets.RAILWAY_BACKEND_SERVICE_ID }}
          RAILWAY_MCP_SERVER_SERVICE_ID: ${{ secrets.RAILWAY_MCP_SERVER_SERVICE_ID }}
