name: Redfin Market Tracker Weekly Import

on:
  # Redfin updates data every Wednesday; import Thursday morning
  schedule:
    - cron: '0 8 * * 4'  # Every Thursday at 8:00 AM UTC

  # Allow manual trigger with geo level filter
  workflow_dispatch:
    inputs:
      geo_level:
        description: 'Which geography level to import (or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - national
          - state
          - metro
          - county
          - city
          - zip
          - neighborhood

jobs:
  import-redfin-data:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 4 hours - neighborhood/zip files are large

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Redfin Market Tracker Import
        id: import
        env:
          SUPABASE_URL: '${{ secrets.SUPABASE_URL }}'
          SUPABASE_SERVICE_KEY: '${{ secrets.SUPABASE_SERVICE_KEY }}'
          NEXT_PUBLIC_SUPABASE_URL: '${{ secrets.SUPABASE_URL }}'
          SUPABASE_SERVICE_ROLE_KEY: '${{ secrets.SUPABASE_SERVICE_KEY }}'
        run: |
          echo "=============================================="
          echo "Redfin Market Tracker Import - $(date)"
          echo "=============================================="

          GEO_ARG=""
          if [ "${{ github.event.inputs.geo_level }}" != "" ] && [ "${{ github.event.inputs.geo_level }}" != "all" ]; then
            GEO_ARG="--geo=${{ github.event.inputs.geo_level }}"
          fi

          npx tsx scripts/redfin-sales-import/import-redfin-sales.ts $GEO_ARG 2>&1 | tee import-output.txt

          if grep -q "ERRORS:" import-output.txt; then
            echo "has_failures=true" >> $GITHUB_OUTPUT
            echo "::warning::Some datasets failed to import"
          else
            echo "has_failures=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Post-Import Refresh
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'post-import-refresh.yml',
                ref: 'main',
                inputs: {
                  trigger_source: 'redfin-import'
                }
              });
              console.log('Triggered post-import refresh workflow');
            } catch (error) {
              console.log('Could not trigger post-import refresh:', error.message);
            }

      - name: Upload Import Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redfin-import-log-${{ github.run_id }}
          path: import-output.txt
          retention-days: 30

    outputs:
      has_failures: ${{ steps.import.outputs.has_failures }}

  notify-on-failure:
    needs: import-redfin-data
    runs-on: ubuntu-latest
    if: failure() || needs.import-redfin-data.outputs.has_failures == 'true'

    steps:
      - name: Create Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const isPartialFailure = '${{ needs.import-redfin-data.outputs.has_failures }}' === 'true';

            const title = isPartialFailure
              ? `Redfin Import Partial Failure - ${date}`
              : `Redfin Import Failed - ${date}`;

            const body = [
              isPartialFailure ? '## Redfin Market Tracker Import Partial Failure' : '## Redfin Market Tracker Import Failure',
              '',
              isPartialFailure
                ? 'Some Redfin datasets failed to import. The workflow completed but with errors.'
                : 'The weekly Redfin market tracker import workflow failed completely.',
              '',
              `**Workflow Run:** [View Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              `**Date:** ${date}`,
              '',
              '### Tables That Should Have Data',
              '- redfin_national',
              '- redfin_state',
              '- redfin_metro',
              '- redfin_county',
              '- redfin_city',
              '- redfin_zip',
              '- redfin_neighborhood',
              '',
              '### Data Source',
              'S3: https://redfin-public-data.s3.us-west-2.amazonaws.com/redfin_market_tracker/',
              '',
              '### Action Required',
              '1. Check workflow logs and the import artifact for detailed errors',
              '2. Verify Supabase credentials are valid',
              '3. Check if Redfin S3 URLs have changed',
              '4. Run `npx tsx scripts/redfin-sales-import/import-redfin-sales.ts` locally to diagnose',
              '5. Re-run the workflow manually once fixed'
            ].join('\n');

            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'data-import,automated',
              state: 'open'
            });

            const hasExisting = existingIssues.some(issue =>
              issue.title.includes('Redfin Import') && issue.title.includes(date)
            );

            if (!hasExisting) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['bug', 'data-import', 'automated']
              });
              console.log('Created failure notification issue');
            } else {
              console.log('Issue already exists for today, skipping creation');
            }

  notify-on-success:
    needs: import-redfin-data
    runs-on: ubuntu-latest
    if: success() && needs.import-redfin-data.outputs.has_failures != 'true'

    steps:
      - name: Log Success
        run: |
          echo "=============================================="
          echo "Redfin Market Tracker Import Completed Successfully"
          echo "Date: $(date)"
          echo "=============================================="
          echo "Data imported to tables:"
          echo "  - redfin_national"
          echo "  - redfin_state"
          echo "  - redfin_metro"
          echo "  - redfin_county"
          echo "  - redfin_city"
          echo "  - redfin_zip"
          echo "  - redfin_neighborhood"
          echo ""
          echo "Check Supabase dashboard to verify."
