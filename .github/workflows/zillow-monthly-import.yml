name: Zillow Data Monthly Import

on:
  # Run on the 18th of every month at 6:00 AM UTC
  # Zillow publishes new data around the 15th-16th, import on 18th for safety
  schedule:
    - cron: '0 6 18 * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      datasets:
        description: 'Which datasets to import'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - zhvi-only
          - zori-only
          - market-indicators
          - affordability

jobs:
  import-zillow-data:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hours for large datasets
    


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Zillow Data Import
        id: import
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "=============================================="
          echo "Zillow Data Import - $(date)"
          echo "=============================================="
          npx tsx scripts/import-all-zillow-datasets.ts 2>&1 | tee import-output.txt

          # Check for failures in output
          if grep -q "Failed: [1-9]" import-output.txt; then
            echo "has_failures=true" >> $GITHUB_OUTPUT
            echo "::warning::Some datasets failed to import"
          else
            echo "has_failures=false" >> $GITHUB_OUTPUT
          fi

      - name: Calculate YoY Growth
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "=============================================="
          echo "Calculating Year-over-Year growth for ZHVI..."
          echo "=============================================="
          npx tsx scripts/calculate-zhvi-yoy-growth.ts 2>&1 | tee -a import-output.txt

      - name: Upload Import Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-log-${{ github.run_id }}
          path: import-output.txt
          retention-days: 30

    outputs:
      has_failures: ${{ steps.import.outputs.has_failures }}

  notify-on-failure:
    needs: import-zillow-data
    runs-on: ubuntu-latest
    if: failure() || needs.import-zillow-data.outputs.has_failures == 'true'

    steps:
      - name: Create Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const isPartialFailure = '${{ needs.import-zillow-data.outputs.has_failures }}' === 'true';

            const title = isPartialFailure
              ? `Zillow Data Import Partial Failure - ${date}`
              : `Zillow Data Import Failed - ${date}`;

            const body = [
              isPartialFailure ? '## Zillow Data Import Partial Failure' : '## Zillow Data Import Failure',
              '',
              isPartialFailure
                ? 'Some Zillow datasets failed to import. The workflow completed but with errors.'
                : 'The monthly Zillow data import workflow failed completely.',
              '',
              `**Workflow Run:** [View Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              `**Date:** ${date}`,
              '',
              '### Tables That Should Have Data',
              '- zillow_state (State-level metrics)',
              '- zillow_metro (Metro/MSA-level metrics)',
              '- zillow_county (County-level metrics)',
              '- zillow_zip (ZIP code-level metrics)',
              '',
              '### Metrics Imported',
              '- zhvi (Home Values)',
              '- zori (Rent Index)',
              '- inventory (For-Sale Inventory)',
              '- dom (Days on Market)',
              '- sale_price (Median Sale Price)',
              '- And more...',
              '',
              '### Action Required',
              '1. Check the workflow logs and downloaded artifact for detailed errors',
              '2. Verify Supabase credentials are valid',
              '3. Check if Zillow CSV URLs have changed',
              '4. Run `npx tsx scripts/zillow-import/import-all.ts` locally to diagnose',
              '5. Re-run the workflow manually once fixed'
            ].join('\n');

            // Check for existing open issue to avoid duplicates
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'data-import,automated',
              state: 'open'
            });

            const hasExisting = existingIssues.some(issue =>
              issue.title.includes('Zillow Data Import') && issue.title.includes(date)
            );

            if (!hasExisting) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['bug', 'data-import', 'automated']
              });
              console.log('Created failure notification issue');
            } else {
              console.log('Issue already exists for today, skipping creation');
            }

  notify-on-success:
    needs: import-zillow-data
    runs-on: ubuntu-latest
    if: success() && needs.import-zillow-data.outputs.has_failures != 'true'

    steps:
      - name: Log Success
        run: |
          echo "=============================================="
          echo "Zillow Data Import Completed Successfully"
          echo "Date: $(date)"
          echo "=============================================="
          echo "Data imported to long-format tables:"
          echo "  - zillow_state"
          echo "  - zillow_metro"
          echo "  - zillow_county"
          echo "  - zillow_zip"
          echo ""
          echo "Check Supabase dashboard to verify."
