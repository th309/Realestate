# Unified Data Pipeline Cycle
#
# Replaces the individual source-specific import workflows with a single
# matrix-based pipeline that imports all data sources, computes calculated
# metrics, and runs the PropertyIQ scoring engine.
#
# Schedule:
#   - 1st of every month at 6 AM UTC (primary cycle)
#   - 15th of every month at 6 AM UTC (mid-month refresh)
#
# Manual trigger:
#   sources = "all" (default) runs every source.
#   sources = "zillow,realtor" runs only those two matrix jobs.
#
# The old per-source workflows (zillow-monthly-import.yml, etc.) are kept
# for rollback safety and will be removed after live verification.

name: Data Pipeline Cycle

on:
  schedule:
    - cron: '0 6 1 * *'   # 1st of every month at 6 AM UTC
    - cron: '0 6 15 * *'  # 15th of every month at 6 AM UTC

  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma-separated sources to run (zillow, realtor, census-economic, building-permits, hud-fmr), or "all"'
        default: 'all'
        type: string

# ---------------------------------------------------------------------------
# Job 1 — Import raw data from each source (parallel matrix)
# ---------------------------------------------------------------------------
jobs:
  import-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 4 hours — matches the longest existing workflow (economic)
    strategy:
      matrix:
        source:
          - zillow
          - realtor
          - census-economic
          - building-permits
          - hud-fmr
      fail-fast: false  # Let other sources finish even if one fails

    # Skip matrix entries that the caller did not request
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.sources == 'all' ||
      github.event.inputs.sources == '' ||
      contains(github.event.inputs.sources, matrix.source)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ----- Zillow -----
      - name: Import Zillow data
        id: zillow
        if: matrix.source == 'zillow'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "=== Zillow Data Import — $(date) ==="
          npx tsx scripts/import-all-zillow-datasets.ts 2>&1 | tee import-output.txt
          echo ""
          echo "=== Calculating ZHVI Year-over-Year growth ==="
          npx tsx scripts/calculate-zhvi-yoy-growth.ts 2>&1 | tee -a import-output.txt

      # ----- Realtor -----
      - name: Import Realtor.com data
        id: realtor
        if: matrix.source == 'realtor'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "=== Realtor.com Data Import — $(date) ==="
          npx tsx scripts/import-realtor-national.ts 2>&1 | tee import-output.txt
          npx tsx scripts/import-realtor-state.ts    2>&1 | tee -a import-output.txt
          npx tsx scripts/import-realtor-metro.ts    2>&1 | tee -a import-output.txt
          npx tsx scripts/import-realtor-county.ts   2>&1 | tee -a import-output.txt
          npx tsx scripts/import-realtor-zip.ts      2>&1 | tee -a import-output.txt

      # ----- Census / Economic -----
      - name: Import Census and Economic data
        id: census-economic
        if: matrix.source == 'census-economic'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          echo "=== Census / Economic Data Download — $(date) ==="
          npx tsx scripts/download-census-economic-data.ts    2>&1 | tee import-output.txt
          npx tsx scripts/download-metro-unemployment-bls.ts  2>&1 | tee -a import-output.txt
          npx tsx scripts/download-qcew-employment.ts         2>&1 | tee -a import-output.txt

          echo ""
          echo "=== Combining economic data with YoY calculations ==="
          npx tsx scripts/combine-economic-data.ts 2>&1 | tee -a import-output.txt

          echo ""
          echo "=== Importing Census data to database ==="
          npx tsx scripts/import-census-data.ts    2>&1 | tee -a import-output.txt

          echo ""
          echo "=== Importing Economic data to database ==="
          npx tsx scripts/import-economic-data.ts  2>&1 | tee -a import-output.txt

      # ----- Building Permits -----
      - name: Import Building Permits data
        id: building-permits
        if: matrix.source == 'building-permits'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "=== Building Permits Download — $(date) ==="
          CURRENT_YEAR=$(date +%Y)
          PREV_YEAR=$((CURRENT_YEAR - 1))
          npx tsx scripts/download-building-permits.ts --start-year=${PREV_YEAR} --end-year=${CURRENT_YEAR} 2>&1 | tee import-output.txt

          echo ""
          echo "=== Importing Building Permits to database ==="
          npx tsx scripts/import-building-permits.ts --geo=county 2>&1 | tee -a import-output.txt
          npx tsx scripts/import-building-permits.ts --geo=state  2>&1 | tee -a import-output.txt

          echo ""
          echo "=== Backfilling YoY totals ==="
          if [ -f "scripts/backfill-permits-total-units.ts" ]; then
            npx tsx scripts/backfill-permits-total-units.ts 2>&1 | tee -a import-output.txt
          fi

      # ----- HUD Fair Market Rent -----
      - name: Import HUD Fair Market Rent data
        id: hud-fmr
        if: matrix.source == 'hud-fmr'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "=== HUD FMR Data Download — $(date) ==="
          npx tsx scripts/download-hud-fmr.ts 2>&1 | tee import-output.txt

          echo ""
          echo "=== Importing HUD FMR to database ==="
          npx tsx scripts/import-hud-fmr.ts   2>&1 | tee -a import-output.txt

      # ----- Upload log artifact (all sources) -----
      - name: Upload import log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-log-${{ matrix.source }}-${{ github.run_id }}
          path: import-output.txt
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 2 — Refresh calculated metrics (cap_rate, gross_yield, income_to_buy …)
  # ---------------------------------------------------------------------------
  calculated-metrics:
    needs: import-sources
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run calculated metrics refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          echo "=== Refreshing Calculated Metrics — $(date) ==="
          npx tsx scripts/populate-calculated-metrics.ts 2>&1 | tee metrics-output.txt

          echo ""
          echo "=== Refreshing income-to-buy and related metrics ==="
          npx tsx scripts/refresh-all-metrics.ts 2>&1 | tee -a metrics-output.txt

      - name: Upload metrics log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculated-metrics-log-${{ github.run_id }}
          path: metrics-output.txt
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 3 — Run PropertyIQ scoring pipeline
  # ---------------------------------------------------------------------------
  scoring:
    needs: calculated-metrics
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scoring pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "=== Running PropertyIQ Scoring Pipeline — $(date) ==="
          npx tsx scripts/calculate-all-scores.ts 2>&1 | tee scoring-output.txt

      - name: Upload scoring log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoring-pipeline-log-${{ github.run_id }}
          path: scoring-output.txt
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 4 — Notify on failure (create GitHub Issue)
  # ---------------------------------------------------------------------------
  notify-on-failure:
    needs: [import-sources, calculated-metrics, scoring]
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Issue for pipeline failure
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const title = `Data Pipeline Failure - ${date}`;
            const body = [
              '## Data Pipeline Cycle Failure',
              '',
              `The unified data pipeline cycle failed on **${date}**.`,
              '',
              `**Workflow Run:** [View Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '### Pipeline stages',
              '| Stage | Description |',
              '|-------|-------------|',
              '| **import-sources** | Zillow, Realtor, Census/Economic, Building Permits, HUD FMR |',
              '| **calculated-metrics** | cap_rate, gross_yield, income_to_buy, overvalued_pct, etc. |',
              '| **scoring** | PropertyIQ HomeReady, InvestorEdge, Market Health scores |',
              '',
              '### Action Required',
              '1. Check the workflow run logs linked above to identify which stage failed.',
              '2. Download the log artifacts for detailed output.',
              '3. If a single source failed, re-run with `sources: <source-name>` to retry just that source.',
              '4. After fixing, re-run the full pipeline or trigger `post-import-refresh.yml` manually.',
            ].join('\n');

            // Avoid duplicate issues for the same day
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'data-pipeline,automated',
              state: 'open'
            });

            const alreadyExists = existingIssues.some(issue =>
              issue.title.includes('Data Pipeline Failure') && issue.title.includes(date)
            );

            if (!alreadyExists) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['bug', 'data-pipeline', 'automated']
              });
              console.log('Created pipeline failure issue');
            } else {
              console.log('Issue already exists for today, skipping');
            }
