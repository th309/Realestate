name: Weekly Data Pipeline

# Single weekly poll that replaces the old per-source monthly import crons
# (which silently no-op'd from Feb–Jun 2026 by calling deleted scripts).
# Imports run idempotently; the heavy post-import refresh/scoring fires ONLY when
# a new data period actually lands. A quiet week is a green no-op, not a failure.

on:
  schedule:
    # Tuesdays 04:00 UTC — finishes before the Tue ~10–11am ET "scores updated"
    # send (Tuesday = peak B2B email open/click).
    - cron: "0 4 * * 2"

  workflow_dispatch:
    inputs:
      source:
        description: "Which source(s) to import"
        required: false
        default: "all"
        type: choice
        options: [all, zillow, realtor, economic, permits, hud, redfin]
      force_refresh:
        description: "Run post-import refresh even if no new data landed"
        required: false
        default: false
        type: boolean

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      has_new_data: ${{ steps.decide.outputs.has_new_data }}
    env:
      SOURCE: ${{ github.event.inputs.source || 'all' }}
      FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
      # Realtor merge windows the _History files (Zip core ~770MB + hotness ~340MB)
      # in memory; bump the Node heap so the parse doesn't OOM (exit 134 / SIGABRT).
      # Runner has 16GB, so 8GB heap is safe headroom for the ~3-4GB parse peak.
      NODE_OPTIONS: --max-old-space-size=8192
      SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
      SUPABASE_SERVICE_KEY: "${{ secrets.SUPABASE_SERVICE_KEY }}"
      NEXT_PUBLIC_SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
      SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_KEY }}"
      # Census/Economic/QCEW imports need these; the old per-source workflows set
      # them and the new pipeline must too (else they fast-fail "KEY not set").
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      - name: Snapshot freshness BEFORE import
        id: before
        run: |
          set -euo pipefail
          # tail -1: drop any dotenvx/tsx banner lines; keep only the JSON line.
          P=$(npx tsx scripts/lib/latest-periods.ts | tail -1)
          echo "BEFORE: $P"
          echo "periods=$P" >> "$GITHUB_OUTPUT"

      # continue-on-error: a few deprecated Zillow dataset URLs (404) or one
      # flaky source must NOT block the others or scoring. The AFTER freshness
      # probe gates the refresh on whether data ACTUALLY advanced, so a failed
      # source simply doesn't advance its tables. Failures surface as warnings.
      - name: Import Zillow
        if: ${{ env.SOURCE == 'all' || env.SOURCE == 'zillow' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          npx tsx scripts/sources/zillow/import-zillow.ts

      - name: Import non-Zillow (selected sources)
        if: ${{ env.SOURCE != 'zillow' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          case "$SOURCE" in
            all)      ONLY="realtor,economic,census,permits,hud,redfin" ;;
            realtor)  ONLY="realtor" ;;
            economic) ONLY="economic,census" ;;
            permits)  ONLY="permits" ;;
            hud)      ONLY="hud" ;;
            redfin)   ONLY="redfin" ;;
            *)        ONLY="realtor,economic,census,permits,hud,redfin" ;;
          esac
          echo ">>> import-all-non-zillow --only=$ONLY"
          npx tsx scripts/import-all-non-zillow.ts --only="$ONLY"

      - name: Snapshot freshness AFTER import
        id: after
        run: |
          set -euo pipefail
          P=$(npx tsx scripts/lib/latest-periods.ts | tail -1)
          echo "AFTER: $P"
          echo "periods=$P" >> "$GITHUB_OUTPUT"

      - name: Decide whether new data landed
        id: decide
        run: |
          set -euo pipefail
          BEFORE='${{ steps.before.outputs.periods }}'
          AFTER='${{ steps.after.outputs.periods }}'
          echo "before: $BEFORE"
          echo "after:  $AFTER"
          if [ "$FORCE_REFRESH" = "true" ]; then
            echo "force_refresh requested -> refresh"
            echo "has_new_data=true" >> "$GITHUB_OUTPUT"
          elif [ "$BEFORE" != "$AFTER" ]; then
            echo "new data detected -> refresh"
            echo "has_new_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "no new data this week -> green no-op, skipping refresh"
            echo "has_new_data=false" >> "$GITHUB_OUTPUT"
          fi

  # Heavy recompute (calculated metrics + PIQ scoring + validation + calibration).
  # Dispatches post-import-refresh.yml only when the import job saw a period
  # advance. Uses createWorkflowDispatch (the proven pattern the old import
  # workflows used) rather than a reusable `uses:` call.
  refresh:
    needs: import
    if: ${{ needs.import.outputs.has_new_data == 'true' }}
    runs-on: ubuntu-latest
    # createWorkflowDispatch needs actions:write; the default token is read-only
    # (the 403 "Resource not accessible by integration" that failed the dispatch).
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'post-import-refresh.yml',
              ref: 'main',
              inputs: { trigger_source: 'weekly-data-pipeline' }
            });
            console.log('Dispatched post-import-refresh (new data detected).');
