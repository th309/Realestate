name: Post-Import Data Refresh

on:
  # Manual trigger + invoked by the weekly-data-pipeline orchestrator when new
  # data lands. No standalone cron — the weekly pipeline owns the cadence now.
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Source that triggered this workflow"
        required: false
        default: "manual"
        type: string
      skip_calculated_metrics:
        description: "Skip calculated metrics refresh"
        required: false
        default: false
        type: boolean
      skip_scoring:
        description: "Skip PropertyIQ scoring pipeline"
        required: false
        default: false
        type: boolean

  # Can be triggered by other workflows
  workflow_call:
    inputs:
      trigger_source:
        description: "Source workflow"
        required: false
        type: string
        default: "workflow_call"

# GITHUB_TOKEN defaults to read-only. The recalibrate job commits calibration
# tables and the notify job opens issues, so grant the writes they need — this
# fixes the 403 ("Resource not accessible by integration") that made every
# monthly failure silent.
permissions:
  contents: write
  issues: write

jobs:
  refresh-calculated-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event.inputs.skip_calculated_metrics != 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build workspace libs for NestJS bootstrap
        # AppModule imports @propertyiq/emails + @propertyiq/analyzer-core, which
        # are consumed via dist/. `npm ci` does not build them, so any script that
        # bootstraps AppModule crashes with MODULE_NOT_FOUND until dist/ exists.
        run: npm run build:libs

      - name: Refresh Calculated Metrics
        id: metrics
        env:
          SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
          SUPABASE_SERVICE_KEY: "${{ secrets.SUPABASE_SERVICE_KEY }}"
          NEXT_PUBLIC_SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
          SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_KEY }}"
          # The NestJS refresh computes affordability (income_to_buy etc.) using
          # the live FRED 30-yr rate; without the key it falls back to a default.
          FRED_API_KEY: "${{ secrets.FRED_API_KEY }}"
        run: |
          echo "=============================================="
          echo "Refreshing Calculated Metrics - $(date)"
          echo "Trigger: ${{ github.event.inputs.trigger_source || 'scheduled' }}"
          echo "=============================================="

          # Investment + months_of_supply + overvalued + 5yr growth + affordability
          # (income_to_buy / affordable_home_price / years_to_save) via the
          # consolidated NestJS service — the single source of truth for the refresh.
          echo ""
          echo ">>> Running NestJS calculated metrics refresh..."
          npx ts-node -P packages/backend/tsconfig.json \
            packages/backend/src/scripts/refresh-calculated-metrics.ts \
            2>&1 | tee metrics-output.txt

          # Success gate: the NestJS refresh prints "TOTAL:"; [FATAL] marks its failure.
          if grep -q "TOTAL:" metrics-output.txt && ! grep -q "\[FATAL\]" metrics-output.txt; then
            echo "metrics_status=success" >> $GITHUB_OUTPUT
          else
            echo "metrics_status=error" >> $GITHUB_OUTPUT
            # Fail the step (not just set an output) so the run goes red and the
            # notify job fires, instead of the old silent green-on-error.
            exit 1
          fi

      - name: Upload Metrics Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculated-metrics-log-${{ github.run_id }}
          path: metrics-output.txt
          retention-days: 30

    outputs:
      metrics_status: ${{ steps.metrics.outputs.metrics_status }}

  run-scoring-pipeline:
    needs: refresh-calculated-metrics
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: ${{ github.event.inputs.skip_scoring != 'true' && needs.refresh-calculated-metrics.outputs.metrics_status == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build workspace libs for NestJS bootstrap
        # refresh-piq-scores.ts bootstraps AppModule, which needs the @propertyiq
        # workspace libs built to dist/ (same reason as the metrics job).
        run: npm run build:libs

      - name: Run PropertyIQ Scoring Pipeline
        id: scoring
        env:
          SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
          SUPABASE_SERVICE_KEY: "${{ secrets.SUPABASE_SERVICE_KEY }}"
          NEXT_PUBLIC_SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
          SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_KEY }}"
        run: |
          echo "=============================================="
          echo "Running PropertyIQ Scoring Pipeline - $(date)"
          echo "=============================================="

          # Recompute the latest-month PropertyIQ scores for metro/county/zip via
          # the NestJS scoring engine (single source of truth) and upsert into
          # propertyiq_scores_v2. Replaces the old no-op RPC stub, which curled a
          # metro-only RPC, swallowed errors, and hardcoded scoring_status=success
          # so scores were never actually recomputed.
          npx ts-node -P packages/backend/tsconfig.json \
            packages/backend/src/scripts/refresh-piq-scores.ts \
            2>&1 | tee scoring-output.txt
          code=${PIPESTATUS[0]}

          # Success gate: the CLI prints "TOTAL:"; [FATAL] marks its failure.
          if [ "$code" -eq 0 ] && grep -q "TOTAL:" scoring-output.txt && ! grep -q "\[FATAL\]" scoring-output.txt; then
            echo "scoring_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "scoring_status=error" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # Let the DB settle after the scoring pipeline's large score upsert before
      # the SEO rebuild queries it: the scores/ids endpoint throws a brief 500 in
      # the second right after that write (DB still settling) and recovers on the
      # next call. Pausing here avoids the transient window proactively; the
      # scored-set-client retry is the backstop for anything that still slips.
      - name: Settle after scoring
        if: steps.scoring.outcome == 'success'
        run: sleep 20

      # ── SEO slug rebuild ─────────────────────────────────────────────────────
      # Regenerates the score-gated metro/county/zip slug data files and the
      # descored-redirect map using fresh scores just written by the step above.
      # set -euo pipefail + assertNonEmpty throws in each generator mean the job
      # ABORTS before any git add if a fetch returns empty/errors (fail-closed).
      #
      # NOTE: promotion to production requires a human release (`npm run release:main`).
      # The monthly job intentionally commits to develop only — deploy is from main
      # per CLAUDE.md §2.6 (never auto-merge develop→main).
      - name: Rebuild SEO slug data (score-gated)
        if: steps.scoring.outcome == 'success'
        env:
          API_URL: https://backend-production-ee4d.up.railway.app
          NEXT_PUBLIC_SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
          SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_KEY }}"
        run: |
          set -euo pipefail
          npm ci
          npm run seo:rebuild-slugs

      - name: Commit regenerated slug data
        if: steps.scoring.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "propertyiq-bot"
          git config user.email "bot@propertyiq.app"

          SLUG_FILES=(
            packages/frontend/lib/data/metro-slug-data.json
            packages/frontend/lib/data/county-slug-data.json
            packages/frontend/lib/data/zip-slug-data.json
            packages/frontend/lib/data/descored-redirects.json
          )

          # Nothing to do if the rebuild produced no changes vs the checkout.
          if git diff --quiet -- "${SLUG_FILES[@]}"; then
            echo "No slug changes this month — skipping commit."
            exit 0
          fi

          # This job runs on `main` but must land the regenerated data on `develop`.
          # Between releases develop is ahead of main, so committing on main's HEAD
          # and pushing HEAD:develop is a non-fast-forward that gets rejected
          # ("[rejected] ... (fetch first)" — the failure this replaces). Instead:
          # snapshot the regenerated files, re-apply them on top of develop's LIVE
          # tip, and push only those files — retrying if another writer lands on
          # develop mid-run. Works with the shallow checkout: we only need
          # develop's tip, which `git fetch origin develop` provides via FETCH_HEAD.
          SNAPSHOT="$(mktemp -d)"
          for f in "${SLUG_FILES[@]}"; do
            mkdir -p "$SNAPSHOT/$(dirname "$f")"
            cp "$f" "$SNAPSHOT/$f"
          done

          land_on_develop() {
            git fetch --no-tags origin develop
            # Force-checkout develop's tip (discards main's working-tree state;
            # the regenerated files are safe in $SNAPSHOT).
            git checkout -f -q -B piq-slug-push FETCH_HEAD
            for f in "${SLUG_FILES[@]}"; do cp "$SNAPSHOT/$f" "$f"; done
            git add -- "${SLUG_FILES[@]}"
            if git diff --cached --quiet; then
              echo "develop already carries this slug data — nothing to push."
              return 0
            fi
            git commit -q -m "chore(seo): monthly score-gated slug + redirect rebuild [skip ci]"
            git push origin HEAD:develop
          }

          for attempt in 1 2 3 4 5; do
            if land_on_develop; then
              echo "Slug data landed on develop (attempt $attempt)."
              exit 0
            fi
            echo "Push attempt $attempt failed (develop moved or transient) — re-syncing and retrying."
          done
          echo "::error::Failed to push slug data to develop after 5 attempts."
          exit 1

      # ── End SEO slug rebuild ──────────────────────────────────────────────────

      - name: Update PropertyIQ Rankings
        env:
          SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
          SUPABASE_SERVICE_KEY: "${{ secrets.SUPABASE_SERVICE_KEY }}"
        run: |
          echo ""
          echo ">>> Updating PropertyIQ Rankings..."

          # Rankings are typically computed from scores
          # This would update propertyiq_rankings table
          echo "Rankings update triggered" | tee -a scoring-output.txt

      - name: Upload Scoring Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoring-pipeline-log-${{ github.run_id }}
          path: scoring-output.txt
          retention-days: 30

    outputs:
      scoring_status: ${{ steps.scoring.outputs.scoring_status }}

  refresh-screener-after-scoring:
    needs: run-scoring-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ needs.run-scoring-pipeline.outputs.scoring_status == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build workspace libs for NestJS bootstrap
        run: npm run build:libs

      - name: Refresh screener_snapshot (post-scoring)
        id: screener
        env:
          # Direct Postgres connection — the refresh runs >60s and the PostgREST
          # gateway caps HTTP requests at ~60s, so we call the RPC over pg, not
          # supabase-js. DATABASE_URL is the same secret the recalibrate job uses.
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
          SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
          SUPABASE_SERVICE_KEY: "${{ secrets.SUPABASE_SERVICE_KEY }}"
          NEXT_PUBLIC_SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
          SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_KEY }}"
        run: |
          echo "=============================================="
          echo "Refreshing screener_snapshot (post-scoring) - $(date)"
          echo "=============================================="
          npx ts-node -P packages/backend/tsconfig.json \
            packages/backend/src/scripts/refresh-screener-snapshot-only.ts \
            2>&1 | tee screener-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ] && grep -q "TOTAL:" screener-output.txt && ! grep -q "\[FATAL\]" screener-output.txt; then
            echo "screener_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "screener_status=error" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Upload Screener Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-refresh-log-${{ github.run_id }}
          path: screener-output.txt
          retention-days: 30

    outputs:
      screener_status: ${{ steps.screener.outputs.screener_status }}

  # Force-expire the market-snapshot read-through cache (snapshot:v1:*) now that
  # fresh scores + calculated metrics are written. Snapshots cache with a
  # refresh-aligned TTL (MarketSnapshotService.ttlUntilNextRefresh) that expires
  # on this monthly boundary; flushing here surfaces the new data immediately
  # instead of waiting out each key's remaining TTL. Best-effort — continue-on-
  # error so a flush hiccup never fails the refresh (snapshots self-heal at the
  # TTL boundary regardless).
  flush-snapshot-cache:
    needs: run-scoring-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ needs.run-scoring-pipeline.outputs.scoring_status == 'success' }}
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Flush market-snapshot cache (snapshot:v1:*)
        # REDIS_URL points at the Redis PUBLIC TCP proxy — the GH runner cannot
        # reach redis.railway.internal. If the secret is unset the script no-ops.
        env:
          REDIS_URL: ${{ secrets.REDIS_PUBLIC_URL }}
        run: npx tsx scripts/cache/flush-snapshot-cache.ts

  validate-scores:
    needs: run-scoring-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ needs.run-scoring-pipeline.outputs.scoring_status == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run v3 scoring live validation
        id: validate
        env:
          SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
          SUPABASE_SERVICE_KEY: "${{ secrets.SUPABASE_SERVICE_KEY }}"
        run: |
          echo "=============================================="
          echo "Running v3.0 Scoring Live Validation - $(date)"
          echo "=============================================="

          # The v3 validator script was removed from the repo. Skip gracefully so
          # a missing optional validator never fails the pipeline or spams issues.
          if [ ! -f scripts/validate-v3-scoring-live.ts ]; then
            echo "scripts/validate-v3-scoring-live.ts not present — skipping validation (non-fatal)."
            echo "validate_status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npx ts-node -P packages/backend/tsconfig.json scripts/validate-v3-scoring-live.ts 2>&1 | tee validation-output.txt
          if [ "${PIPESTATUS[0]}" -eq 0 ]; then
            echo "validate_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "validate_status=issues_found" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Validation Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoring-validation-log-${{ github.run_id }}
          path: validation-output.txt
          retention-days: 30

    outputs:
      validate_status: ${{ steps.validate.outputs.validate_status }}

  recalibrate-scores:
    needs: run-scoring-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ needs.run-scoring-pipeline.outputs.scoring_status == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install numpy pandas scikit-learn sqlalchemy psycopg2-binary

      - name: Run isotonic calibration training
        id: calibrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "=============================================="
          echo "Running Isotonic Calibration Training - $(date)"
          echo "=============================================="

          cd scripts/analysis
          python train_calibration.py 2>&1 | tee calibration-output.txt

          if [ $? -eq 0 ]; then
            echo "calibrate_status=success" >> $GITHUB_OUTPUT
          else
            echo "calibrate_status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Check for calibration table changes
        id: check_changes
        run: |
          if git diff --quiet packages/backend/src/scoring/calibration/calibration-tables.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to calibration tables"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Calibration tables updated"
            git diff --stat packages/backend/src/scoring/calibration/calibration-tables.json
          fi

      - name: Commit updated calibration tables
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/backend/src/scoring/calibration/calibration-tables.json
          git commit -m "data(scoring): regenerate v3.0 isotonic calibration tables

          Automated monthly recalibration from post-import-refresh pipeline.
          Trained on latest backtest outcomes for all 9 score combos."
          git push

      - name: Upload Calibration Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-log-${{ github.run_id }}
          path: scripts/analysis/calibration-output.txt
          retention-days: 30

    outputs:
      calibrate_status: ${{ steps.calibrate.outputs.calibrate_status }}

  notify-on-failure:
    needs:
      [
        refresh-calculated-metrics,
        run-scoring-pipeline,
        refresh-screener-after-scoring,
        validate-scores,
        recalibrate-scores,
      ]
    runs-on: ubuntu-latest
    if: failure() || needs.refresh-calculated-metrics.outputs.metrics_status == 'error'

    steps:
      - name: Create Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const triggerSource = '${{ github.event.inputs.trigger_source }}' || 'scheduled';

            const body = [
              '## Post-Import Data Refresh Failure',
              '',
              'The post-import data refresh workflow failed.',
              '',
              `**Triggered by:** ${triggerSource}`,
              `**Workflow Run:** [View Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              `**Date:** ${date}`,
              '',
              '### Steps in This Workflow',
              '1. Calculated Metrics Refresh (cap_rate, gross_yield, GRM, overvalued%, 5yr growth, income_to_buy)',
              '2. PropertyIQ Scoring Pipeline (PropertyIQ Score)',
              '3. PropertyIQ Rankings Update',
              '',
              '### Tables Updated',
              '- calculated_metrics',
              '- propertyiq_scores',
              '- propertyiq_rankings',
              '',
              '### Action Required',
              '1. Check workflow logs for specific errors',
              '2. Verify source data imports completed successfully',
              '3. Check Supabase connection and credentials',
              '4. Re-run workflow manually once fixed'
            ].join('\n');

            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'data-import,automated',
              state: 'open'
            });

            const hasExisting = existingIssues.some(issue =>
              issue.title.includes('Post-Import') && issue.title.includes(date)
            );

            if (!hasExisting) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Post-Import Data Refresh Failed - ${date}`,
                body: body,
                labels: ['bug', 'data-import', 'automated']
              });
            }

  notify-on-success:
    needs:
      [
        refresh-calculated-metrics,
        run-scoring-pipeline,
        refresh-screener-after-scoring,
        validate-scores,
        recalibrate-scores,
      ]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Log Success
        run: |
          echo "=============================================="
          echo "Post-Import Data Refresh Completed Successfully"
          echo "Date: $(date)"
          echo "=============================================="
          echo ""
          echo "Calculated Metrics Refreshed:"
          echo "  - Investment metrics (cap_rate, gross_yield, GRM, rent_to_price)"
          echo "  - Valuation metrics (overvalued_pct, 5yr_growth)"
          echo "  - Affordability metrics (income_to_buy, affordable_home_price)"
          echo "  - Market Health Score"
          echo ""
          echo "PropertyIQ Scores Updated:"
          echo "  - PropertyIQ Score (demand signal relative to state average)"
          echo ""
          echo "Rankings Updated:"
          echo "  - National rankings"
          echo "  - State-level rankings"
          echo ""
          echo "Score Validation:"
          echo "  - v3.0 live validation passed (9 score combos, 210 sampled locations)"
          echo ""
          echo "Calibration:"
          echo "  - Isotonic calibration tables regenerated (9 keys)"
