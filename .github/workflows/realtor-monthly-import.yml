name: Realtor.com Data Monthly Import

on:
  # Run on the 15th of every month at 6:00 AM UTC
  schedule:
    - cron: '0 6 15 * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Which dataset to import'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - national
          - state
          - metro
          - county
          - zip

jobs:
  import-realtor-data:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hours for large ZIP dataset
    


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Realtor.com Data Import
        id: import
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "=============================================="
          echo "Realtor.com Data Import - $(date)"
          echo "=============================================="

          # Import National data
          echo ""
          echo ">>> Importing National data..."
          npx tsx scripts/import-realtor-national.ts 2>&1 | tee import-output.txt

          # Import State data
          echo ""
          echo ">>> Importing State data..."
          npx tsx scripts/import-realtor-state.ts 2>&1 | tee -a import-output.txt

          # Import Metro data
          echo ""
          echo ">>> Importing Metro data..."
          npx tsx scripts/import-realtor-metro.ts 2>&1 | tee -a import-output.txt

          # Import County data
          echo ""
          echo ">>> Importing County data..."
          npx tsx scripts/import-realtor-county.ts 2>&1 | tee -a import-output.txt

          # Import ZIP data
          echo ""
          echo ">>> Importing ZIP data..."
          npx tsx scripts/import-realtor-zip.ts 2>&1 | tee -a import-output.txt

          # Check for failures in output
          if grep -q "COMPLETED WITH ERRORS" import-output.txt; then
            echo "has_failures=true" >> $GITHUB_OUTPUT
            echo "::warning::Import completed with errors"
          else
            echo "has_failures=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Import Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realtor-import-log-${{ github.run_id }}
          path: import-output.txt
          retention-days: 30

    outputs:
      has_failures: ${{ steps.import.outputs.has_failures }}

  notify-on-failure:
    needs: import-realtor-data
    runs-on: ubuntu-latest
    if: failure() || needs.import-realtor-data.outputs.has_failures == 'true'

    steps:
      - name: Create Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const isPartialFailure = '${{ needs.import-realtor-data.outputs.has_failures }}' === 'true';

            const title = isPartialFailure
              ? `Realtor.com Data Import Partial Failure - ${date}`
              : `Realtor.com Data Import Failed - ${date}`;

            const body = [
              isPartialFailure ? '## Realtor.com Data Import Partial Failure' : '## Realtor.com Data Import Failure',
              '',
              isPartialFailure
                ? 'Some Realtor.com datasets failed to import. The workflow completed but with errors.'
                : 'The monthly Realtor.com data import workflow failed completely.',
              '',
              `**Workflow Run:** [View Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              `**Date:** ${date}`,
              '',
              '### Tables That Should Have Data',
              '- realtor_national (National-level metrics)',
              '- realtor_state (State-level metrics)',
              '- realtor_metro (Metro-level metrics with hotness)',
              '- realtor_county (County-level metrics with hotness)',
              '- realtor_zip (ZIP-level metrics with hotness)',
              '',
              '### Metrics Imported',
              '- Core: median_listing_price, active_listing_count, median_days_on_market, etc.',
              '- Hotness: hotness_rank, hotness_score, supply_score, demand_score, etc.',
              '',
              '### Action Required',
              '1. Check the workflow logs and downloaded artifact for detailed errors',
              '2. Verify Supabase credentials are valid',
              '3. Check if Realtor.com CSV URLs have changed',
              '4. Run import scripts locally to diagnose',
              '5. Re-run the workflow manually once fixed'
            ].join('\n');

            // Check for existing open issue to avoid duplicates
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'data-import,automated',
              state: 'open'
            });

            const hasExisting = existingIssues.some(issue =>
              issue.title.includes('Realtor.com Data Import') && issue.title.includes(date)
            );

            if (!hasExisting) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['bug', 'data-import', 'automated']
              });
              console.log('Created failure notification issue');
            } else {
              console.log('Issue already exists for today, skipping creation');
            }

  notify-on-success:
    needs: import-realtor-data
    runs-on: ubuntu-latest
    if: success() && needs.import-realtor-data.outputs.has_failures != 'true'

    steps:
      - name: Log Success
        run: |
          echo "=============================================="
          echo "Realtor.com Data Import Completed Successfully"
          echo "Date: $(date)"
          echo "=============================================="
          echo "Data imported to:"
          echo "  - realtor_national"
          echo "  - realtor_state"
          echo "  - realtor_metro"
          echo "  - realtor_county"
          echo "  - realtor_zip"
          echo ""
          echo "Check Supabase dashboard to verify."
