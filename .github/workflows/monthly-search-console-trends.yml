name: Monthly Search Console Trends

# Classifies Search Console queries into a professional/investor-intent bucket
# (excluding a known bot-generated query cluster, branded queries, and generic
# geo lookups — see scripts/analytics/search-console-classify.js), tracks
# month-over-month deltas, and commits a dated report to develop. Detection
# only — this does NOT generate or publish any blog/FAQ/page content; the
# report is reviewed manually (or with Claude) when planning content.

on:
  schedule:
    # 1st of the month, 09:00 UTC. Independent of monthly-data-pipeline.yml's
    # 17th cadence — this isn't tied to Zillow/Realtor release dates.
    - cron: "0 9 1 * *"

  workflow_dispatch:
    inputs:
      as_of:
        description: "Override the as-of date (YYYY-MM-DD); defaults to today"
        required: false
        type: string

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Decode GCP service-account key
        run: |
          echo "${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}" | base64 -d > "$RUNNER_TEMP/gsc-key.json"

      - name: Run trend report
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gsc-key.json
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${{ inputs.as_of }}" ]; then
            ARGS="--asOf=${{ inputs.as_of }}"
          fi
          node scripts/analytics/search-console-trends.js $ARGS

      - name: Commit + push report to develop
        run: |
          set -euo pipefail
          git config user.name "propertyiq-bot"
          git config user.email "bot@propertyiq.app"

          git add docs/analytics/search-console-content-trends.md \
                  docs/analytics/search-console-trends/snapshots

          if git diff --cached --quiet; then
            echo "No trend report changes — nothing to commit."
            exit 0
          fi

          git commit -q -m "chore(analytics): monthly search console trends [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:develop; then
              echo "Published trend report to develop (attempt $attempt)."
              exit 0
            fi
            echo "Push attempt $attempt rejected — develop moved; rebasing and retrying."
            git fetch --no-tags origin develop
            git rebase origin/develop || { git rebase --abort; echo "::error::Rebase onto develop conflicted — aborting."; exit 1; }
          done
          echo "::error::Failed to push trend report to develop after 5 attempts."
          exit 1
