# Nixpacks configuration for Railway
# Adds Python support alongside Node.js for ML workflow scripts

providers = []

[phases.setup]
nixPkgs = ["nodejs_20", "npm", "python312", "python312Packages.pip"]

[phases.install]
dependsOn = ["setup"]
cmds = [
    "npm ci",
    "pip install -r requirements.txt"
]

[phases.build]
dependsOn = ["install"]
cmds = ["npm run build"]

[start]
cmd = "node dist/main.js"
