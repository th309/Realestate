# Nixpacks config for PropertyIQ backend on Railway.
# Adds Python 3 plus edge-tts for content-pipeline TTS synthesis.
# Chromium for Puppeteer is auto-installed by Nixpacks when puppeteer is a runtime dep.

[phases.setup]
nixPkgs = ["nodejs_22", "python3", "python3Packages.pip"]

[phases.install]
cmds = [
  "npm ci",
  "pip3 install --break-system-packages edge-tts==6.1.12 yt-dlp==2024.10.7",
]

[variables]
YT_DLP_BIN = "/usr/local/bin/yt-dlp"

[start]
cmd = "npm run start:prod"
